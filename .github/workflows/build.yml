name: build

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

# ============================================================================
# 变体说明（v13.0）
#   release : Makefile 默认 —— Tweak.xm + REAUI.xm，完整功能
#   m1      : make M1=1      —— 只有 M1Trace.xm，纯观测、不装任何净化锚点
# 两个变体的 TWEAK_NAME / install_name / plist 完全相同，
# 因此"换不换观察员"在真机上只表现为同一个 dylib 文件被替换。
# 两个变体都必须过 ci/gates.py 同一套门禁，没有任何一条免检通道。
# ============================================================================

jobs:
  build:
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-14

    env:
      THEOS: /Users/runner/theos
      THEOS_MAKE_PATH: /Users/runner/theos/makefiles

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          brew install ldid xz make 2>/dev/null || brew install ldid xz
          clang --version | head -3
          python3 --version

      - name: Fetch Theos + iPhoneOS SDKs
        run: |
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$THEOS"
          mkdir -p "$THEOS/sdks"
          curl -fsSL https://github.com/theos/sdks/archive/master.tar.gz -o /tmp/sdks.tar.gz
          tar xzf /tmp/sdks.tar.gz -C /tmp
          for d in /tmp/sdks-master/iPhoneOS*.sdk; do
            cp -R "$d" "$THEOS/sdks/" 2>/dev/null || true
          done
          ls "$THEOS/sdks"

      # ================= 变体 1：release =================
      - name: Build release
        run: |
          set -o pipefail
          make clean || true
          make FINALPACKAGE=1 2>&1 | tee build-release.log
          echo "--- raw outputs ---"
          find .theos/obj -name '*.dylib' 2>/dev/null | sort
          mkdir -p out/release
          FAT=$(find .theos/obj -maxdepth 3 -name 'BluedHushREA.dylib' | head -1)
          echo "FAT=$FAT"
          test -n "$FAT"
          cp "$FAT" out/release/BluedHushREA.dylib
          for arch in arm64 arm64e; do
            f=".theos/obj/$arch/BluedHushREA.dylib"
            if [ -f "$f" ]; then mkdir -p "out/release/$arch"; cp "$f" "out/release/$arch/"; fi
          done
          ls -lR out/release

      - name: Gate release (arch + deps + symbols + tag)
        run: |
          set -o pipefail
          python3 ci/gates.py --dylib out/release/BluedHushREA.dylib \
            --archs arm64,arm64e --tag "BLUEDHUSH,v16.0-PANEL" --label release
          echo "== otool -L (人眼复核) =="
          otool -L out/release/BluedHushREA.dylib | tee deps-release.txt
          echo "== install_name =="
          otool -D out/release/BluedHushREA.dylib || true
          echo "== LC_RPATH =="
          otool -l out/release/BluedHushREA.dylib | grep -A2 LC_RPATH || echo "(none)"
          echo "== 未定义 MSHook* =="
          nm -u out/release/BluedHushREA.dylib | grep -i 'MSHook' && { echo "::error::release still references MSHook*"; exit 1; } || echo "OK: none"
          echo "== Logos 符号 =="
          nm out/release/BluedHushREA.dylib | grep -i 'logos' && { echo "::error::release has Logos symbols"; exit 1; } || echo "OK: none"

      # ================= 变体 2：M-1 取证观测版 =================
      - name: Build m1 (trace only)
        run: |
          set -o pipefail
          make clean || true
          make M1=1 FINALPACKAGE=1 2>&1 | tee build-m1.log
          echo "--- raw outputs (m1) ---"
          find .theos/obj -name '*.dylib' 2>/dev/null | sort
          mkdir -p out/m1
          FAT=$(find .theos/obj -maxdepth 3 -name 'BluedHushREA.dylib' | head -1)
          echo "FAT=$FAT"
          test -n "$FAT"
          cp "$FAT" out/m1/BluedHushREA.dylib
          # 护栏：M1 变体不许把净化引擎编进去
          if strings -a out/m1/BluedHushREA.dylib | grep -q 'REAInstallPurify'; then
            echo "::error::M1 变体里出现了 REAInstallPurify —— Makefile 的 ifeq 没生效，产物不对"
            exit 1
          fi
          if ! strings -a out/m1/BluedHushREA.dylib | grep -q 'M1-TRACE-v3'; then
            echo "::error::M1 变体里找不到 M1-TRACE-v3 标记"
            exit 1
          fi
          ls -lR out/m1

      - name: Gate m1 (arch + deps + symbols + tag)
        run: |
          set -o pipefail
          python3 ci/gates.py --dylib out/m1/BluedHushREA.dylib \
            --archs arm64,arm64e --tag "REA-Test,M1-TRACE-v3,m1.log" \
            --forbid "192.168.1.10,M1-DISCOVER,m1log_server" --label m1
          otool -L out/m1/BluedHushREA.dylib | tee deps-m1.txt
          otool -D out/m1/BluedHushREA.dylib || true

      # ================= 打包（两个变体各自独立目录，绝不混装） =================
      - name: Stage dist
        if: always()
        run: |
          rm -rf dist dist-m1

          # ---- release ----
          mkdir -p dist
          if [ -f out/release/BluedHushREA.dylib ]; then cp out/release/BluedHushREA.dylib dist/; fi
          for arch in arm64 arm64e; do
            if [ -f "out/release/$arch/BluedHushREA.dylib" ]; then mkdir -p "dist/$arch"; cp "out/release/$arch/BluedHushREA.dylib" "dist/$arch/"; fi
          done
          cp BluedHushREA.plist dist/ || true
          for d in packages/*.deb; do [ -f "$d" ] && cp "$d" dist/; done
          cat > dist/INSTALL.txt <<'EOF'
          BluedHushREA v13.0 release  (pure ObjC Runtime hooks, no CydiaSubstrate, no Logos)

          文件
            BluedHushREA.dylib        FAT 双切片（arm64 + arm64e），非越狱/自签/LiveContainer 用这个
            arm64/BluedHushREA.dylib  仅 arm64（A11 及以前）
            arm64e/BluedHushREA.dylib 仅 arm64e（A12 及以后）
            BluedHushREA.plist        substrate 过滤器（仅越狱环境需要）

          日志
            App 沙盒 Documents/BluedHushREA.log，同时 NSLog 输出，Console/syslog 过滤 "REA-Test"

          注入（Esign / Sideloadly）
            1. 「注入动态库」选择 BluedHushREA.dylib
            2. 注入路径 @executable_path/Frameworks/BluedHushREA.dylib
            3. 与主 App 同证书 + 同描述文件重签后安装
          EOF

          # ---- M-1 取证观测版 ----
          mkdir -p dist-m1
          if [ -f out/m1/BluedHushREA.dylib ]; then cp out/m1/BluedHushREA.dylib dist-m1/; fi
          cp BluedHushREA.plist dist-m1/ || true
          cat > dist-m1/INSTALL-M1.txt <<'EOF'
          BluedHushREA M-1 取证观测版  (variant: m1 / M1-TRACE-v3, source: M1Trace.xm)

          这个 dylib 和 release 版同名、同注入路径，但内部完全不同：
            · 不安装任何净化锚点（不 swizzle assembleSplashContainerView / showSplashAd* / PK_VIEW）
            · 不联网、不建 socket、不弹窗、不加任何 UI
            · 只做四件事：本地落盘、崩溃环形缓冲、主线程阻塞采样、锚点可达性清点
            · 首次进 App 会把 purify_splash_mode 写成 0（仅当它还不存在）

                      ⚠ 装法：整份替换，不要和 v12 的 dylib 叠加 ⚠

          注入路径（与 v12 完全相同）
            @executable_path/Frameworks/BluedHushREA.dylib
            重签时必须与主 App 同证书 / 同描述文件，否则 dyld 直接拒绝加载

          日志（v3：纯本地落盘）
            主日志：App 沙盒 Documents/m1.log
            崩溃  ：App 沙盒 Documents/m1-crash.log
            写法  ：主线程只 memcpy 进 32KB 缓冲，串行后台队列 write()+fsync()；
                    每 4KB 或每 1s 冲刷一次，进后台 / 退出前各再冲一次
            首行形如：[REA-Test] t=0.0xx [M1] SINK open=12 log=/var/mobile/.../Documents/m1.log
                    ↑ 这一行的 log= 就是绝对路径，照它找文件
            静音  ：defaults 里 rea_m1_off = YES（仍保留崩溃落盘）

          怎么把 m1.log 拿出来（三选一）
            A. 重签时给 Info.plist 加两个键，之后「文件」App 直接可见：
                 UIFileSharingEnabled = true
                 LSSupportsOpeningDocumentsInPlace = true
               仓库里 tools/patch_infoplist.py 能直接打补丁：
                 python tools\patch_infoplist.py in.ipa out.ipa
            B. iTunes/Finder 备份 → iMazing / iBackupBot / 爱思「备份管理」→
               AppDomain-com.danlan.xiaolan/Documents/m1.log
            C. 重签工具（Esign 等）自带的应用沙盒文件浏览
          EOF

          echo "--- dist ---";    ls -lR dist    || true
          echo "--- dist-m1 ---"; ls -lR dist-m1 || true
          test -s dist/BluedHushREA.dylib   && echo "release OK: $(wc -c < dist/BluedHushREA.dylib) bytes"
          test -s dist-m1/BluedHushREA.dylib && echo "m1 OK: $(wc -c < dist-m1/BluedHushREA.dylib) bytes"

      - name: Upload release artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BluedHushREA-dylib
          path: dist/**
          if-no-files-found: error
          retention-days: 14

      - name: Upload m1 artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BluedHushREA-dylib-m1
          path: dist-m1/**
          if-no-files-found: warn
          retention-days: 14

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            build-release.log
            build-m1.log
            deps-release.txt
            deps-m1.txt
          if-no-files-found: ignore

  # ==========================================================================
  # original-re : BluedHush_5.19.dylib 的还原工程（76 类 / 1015 方法 / 309 hooks）
  # 与上面两个变体完全独立：不同 Makefile、不同 TWEAK_NAME、不同产物。
  # ==========================================================================
  build-original-re:
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-14

    env:
      THEOS: /Users/runner/theos
      THEOS_MAKE_PATH: /Users/runner/theos/makefiles

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          brew install ldid xz make 2>/dev/null || brew install ldid xz
          clang --version | head -3

      - name: Fetch Theos + iPhoneOS SDKs
        run: |
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$THEOS"
          mkdir -p "$THEOS/sdks"
          curl -fsSL https://github.com/theos/sdks/archive/master.tar.gz -o /tmp/sdks.tar.gz
          tar xzf /tmp/sdks.tar.gz -C /tmp
          for d in /tmp/sdks-master/iPhoneOS*.sdk; do
            cp -R "$d" "$THEOS/sdks/" 2>/dev/null || true
          done
          ls "$THEOS/sdks"

      - name: Sanity (tree shape)
        run: |
          echo "headers: $(ls original-re/Headers/*.h | wc -l)"
          echo "impls  : $(ls original-re/Classes/*.m | wc -l)"
          echo "hooks  : $(grep -c '^%hook' original-re/Hooks/Hooks.generated.xm)"
          test "$(ls original-re/Headers/*.h | wc -l)" = "76"
          test "$(ls original-re/Classes/*.m | wc -l)" = "76"

      - name: Build original-re
        run: |
          set -o pipefail
          make -C original-re clean || true
          make -C original-re FINALPACKAGE=1 2>&1 | tee build-original-re.log
          echo "--- outputs ---"
          find original-re/.theos/obj -name '*.dylib' | sort

      - name: Report (does not fail the job)
        if: always()
        run: |
          echo "== error summary =="
          grep -E "error:" build-original-re.log | sed 's/^.*original-re\///' | sort | uniq -c | sort -rn | head -40 || true
          echo "== distinct failing files =="
          grep -E "error:" build-original-re.log | sed -E 's/^([^:]+):.*/\1/' | sort -u | head -40 || true
          echo "== total errors =="
          grep -c "error:" build-original-re.log || true

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: original-re-build
          path: |
            build-original-re.log
            original-re/.theos/obj/**/*.dylib
          if-no-files-found: warn
          retention-days: 14

  # ==========================================================================
  # build-original-re-linux : 同一份 original-re，跑在 ubuntu（Linux 分钟不计 macOS 配额）
  # 只验证 ObjC 语法/链接，不追求 arm64e 切片 —— 架构降到 arm64 单切片。
  # ==========================================================================
  build-original-re-linux:
    runs-on: ubuntu-latest

    env:
      THEOS: ${{ github.workspace }}/theos

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install toolchain (Linux)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang lld build-essential libssl-dev zstd curl git make || \
            sudo apt-get install -y -qq clang build-essential libssl-dev zstd curl git make
          # ubuntu-24.04 has no ldid package; grab the procursus build (non-fatal if it moves)
          curl -fsSL -o /tmp/ldid \
            "https://github.com/ProcursusTeam/ldid/releases/download/v2.1.5-procursus7/ldid_linux_x86_64" || true
          if [ -s /tmp/ldid ]; then sudo install -m755 /tmp/ldid /usr/local/bin/ldid; fi
          which ldid || echo "ldid absent (compile-only build does not need it)"
          clang --version | head -2

      - name: Fetch Theos + iPhoneOS SDK
        run: |
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$THEOS"
          mkdir -p "$THEOS/sdks"
          curl -fsSL https://github.com/theos/sdks/archive/master.tar.gz -o /tmp/sdks.tar.gz
          tar xzf /tmp/sdks.tar.gz -C /tmp
          for d in /tmp/sdks-master/iPhoneOS*.sdk; do cp -R "$d" "$THEOS/sdks/" 2>/dev/null || true; done
          ls "$THEOS/sdks"

      - name: Sanity (tree shape)
        run: |
          echo "headers: $(ls original-re/Headers/*.h | wc -l)"
          echo "impls  : $(ls original-re/Classes/*.m | wc -l)"
          echo "hooks  : $(grep -c '^%hook' original-re/Hooks/Hooks.generated.xm)"
          test "$(ls original-re/Headers/*.h | wc -l)" = "76"
          test "$(ls original-re/Classes/*.m | wc -l)" = "76"

      - name: Build original-re (arm64)
        run: |
          set -o pipefail
          make -C original-re clean || true
          make -C original-re ARCHS=arm64 2>&1 | tee build-original-re-linux.log
          echo "--- outputs ---"
          find original-re/.theos/obj -name '*.dylib' | sort

      - name: Report (does not fail the job)
        if: always()
        run: |
          echo "== total errors =="
          grep -c "error:" build-original-re-linux.log || true
          echo "== errors by message =="
          grep -E "error:" build-original-re-linux.log | sed -E 's/^.*error: //' | sort | uniq -c | sort -rn | head -40 || true
          echo "== distinct failing files =="
          grep -E "error:" build-original-re-linux.log | sed -E 's/^([^:]+):.*/\1/' | sort | uniq -c | sort -rn | head -40 || true

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: original-re-build-linux
          path: |
            build-original-re-linux.log
            original-re/.theos/obj/**/*.dylib
          if-no-files-found: warn
          retention-days: 14
