name: build

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

# ============================================================================
# 变体说明（v13.0）
#   release : Makefile 默认 —— Tweak.xm + REAUI.xm，完整功能
#   m1      : make M1=1      —— 只有 M1Trace.xm，纯观测、不装任何净化锚点
# 两个变体的 TWEAK_NAME / install_name / plist 完全相同，
# 因此"换不换观察员"在真机上只表现为同一个 dylib 文件被替换。
# 两个变体都必须过 ci/gates.py 同一套门禁，没有任何一条免检通道。
# ============================================================================

jobs:
  build:
    runs-on: macos-14

    env:
      THEOS: /Users/runner/theos
      THEOS_MAKE_PATH: /Users/runner/theos/makefiles

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          brew install ldid xz make 2>/dev/null || brew install ldid xz
          clang --version | head -3
          python3 --version

      - name: Fetch Theos + iPhoneOS SDKs
        run: |
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$THEOS"
          mkdir -p "$THEOS/sdks"
          curl -fsSL https://github.com/theos/sdks/archive/master.tar.gz -o /tmp/sdks.tar.gz
          tar xzf /tmp/sdks.tar.gz -C /tmp
          for d in /tmp/sdks-master/iPhoneOS*.sdk; do
            cp -R "$d" "$THEOS/sdks/" 2>/dev/null || true
          done
          ls "$THEOS/sdks"

      # ================= 变体 1：release =================
      - name: Build release
        run: |
          set -o pipefail
          make clean || true
          make FINALPACKAGE=1 2>&1 | tee build-release.log
          echo "--- raw outputs ---"
          find .theos/obj -name '*.dylib' 2>/dev/null | sort
          mkdir -p out/release
          FAT=$(find .theos/obj -maxdepth 3 -name 'BluedHushREA.dylib' | head -1)
          echo "FAT=$FAT"
          test -n "$FAT"
          cp "$FAT" out/release/BluedHushREA.dylib
          for arch in arm64 arm64e; do
            f=".theos/obj/$arch/BluedHushREA.dylib"
            if [ -f "$f" ]; then mkdir -p "out/release/$arch"; cp "$f" "out/release/$arch/"; fi
          done
          ls -lR out/release

      - name: Gate release (arch + deps + symbols + tag)
        run: |
          set -o pipefail
          python3 ci/gates.py --dylib out/release/BluedHushREA.dylib \
            --archs arm64,arm64e --tag REA-Test --label release
          echo "== otool -L (人眼复核) =="
          otool -L out/release/BluedHushREA.dylib | tee deps-release.txt
          echo "== install_name =="
          otool -D out/release/BluedHushREA.dylib || true
          echo "== LC_RPATH =="
          otool -l out/release/BluedHushREA.dylib | grep -A2 LC_RPATH || echo "(none)"
          echo "== 未定义 MSHook* =="
          nm -u out/release/BluedHushREA.dylib | grep -i 'MSHook' && { echo "::error::release still references MSHook*"; exit 1; } || echo "OK: none"
          echo "== Logos 符号 =="
          nm out/release/BluedHushREA.dylib | grep -i 'logos' && { echo "::error::release has Logos symbols"; exit 1; } || echo "OK: none"

      # ================= 变体 2：M-1 取证观测版 =================
      - name: Build m1 (trace only)
        run: |
          set -o pipefail
          make clean || true
          make M1=1 FINALPACKAGE=1 2>&1 | tee build-m1.log
          echo "--- raw outputs (m1) ---"
          find .theos/obj -name '*.dylib' 2>/dev/null | sort
          mkdir -p out/m1
          FAT=$(find .theos/obj -maxdepth 3 -name 'BluedHushREA.dylib' | head -1)
          echo "FAT=$FAT"
          test -n "$FAT"
          cp "$FAT" out/m1/BluedHushREA.dylib
          # 护栏：M1 变体不许把净化引擎编进去
          if strings -a out/m1/BluedHushREA.dylib | grep -q 'REAInstallPurify'; then
            echo "::error::M1 变体里出现了 REAInstallPurify —— Makefile 的 ifeq 没生效，产物不对"
            exit 1
          fi
          if ! strings -a out/m1/BluedHushREA.dylib | grep -q 'M1-TRACE-v2'; then
            echo "::error::M1 变体里找不到 M1-TRACE-v2 标记"
            exit 1
          fi
          ls -lR out/m1

      - name: Gate m1 (arch + deps + symbols + tag)
        run: |
          set -o pipefail
          python3 ci/gates.py --dylib out/m1/BluedHushREA.dylib \
            --archs arm64,arm64e --tag "REA-Test,M1-TRACE-v2,192.168.1.10:8765" --label m1
          otool -L out/m1/BluedHushREA.dylib | tee deps-m1.txt
          otool -D out/m1/BluedHushREA.dylib || true

      # ================= 打包（两个变体各自独立目录，绝不混装） =================
      - name: Stage dist
        if: always()
        run: |
          rm -rf dist dist-m1

          # ---- release ----
          mkdir -p dist
          if [ -f out/release/BluedHushREA.dylib ]; then cp out/release/BluedHushREA.dylib dist/; fi
          for arch in arm64 arm64e; do
            if [ -f "out/release/$arch/BluedHushREA.dylib" ]; then mkdir -p "dist/$arch"; cp "out/release/$arch/BluedHushREA.dylib" "dist/$arch/"; fi
          done
          cp BluedHushREA.plist dist/ || true
          for d in packages/*.deb; do [ -f "$d" ] && cp "$d" dist/; done
          cat > dist/INSTALL.txt <<'EOF'
          BluedHushREA v13.0 release  (pure ObjC Runtime hooks, no CydiaSubstrate, no Logos)

          文件
            BluedHushREA.dylib        FAT 双切片（arm64 + arm64e），非越狱/自签/LiveContainer 用这个
            arm64/BluedHushREA.dylib  仅 arm64（A11 及以前）
            arm64e/BluedHushREA.dylib 仅 arm64e（A12 及以后）
            BluedHushREA.plist        substrate 过滤器（仅越狱环境需要）

          日志
            App 沙盒 Documents/BluedHushREA.log，同时 NSLog 输出，Console/syslog 过滤 "REA-Test"

          注入（Esign / Sideloadly）
            1. 「注入动态库」选择 BluedHushREA.dylib
            2. 注入路径 @executable_path/Frameworks/BluedHushREA.dylib
            3. 与主 App 同证书 + 同描述文件重签后安装
          EOF

          # ---- M-1 取证观测版 ----
          mkdir -p dist-m1
          if [ -f out/m1/BluedHushREA.dylib ]; then cp out/m1/BluedHushREA.dylib dist-m1/; fi
          cp BluedHushREA.plist dist-m1/ || true
          cat > dist-m1/INSTALL-M1.txt <<'EOF'
          BluedHushREA M-1 取证观测版  (variant: m1, source: M1Trace.xm)

          这个 dylib 和 release 版同名、同注入路径，但内部完全不同：
            · 不安装任何净化锚点（不 swizzle assembleSplashContainerView / showSplashAd* / PK_VIEW）
            · 只做四件事：落盘日志、崩溃环形缓冲、主线程阻塞采样、锚点可达性清点
            · 首次进 App 会把 purify_splash_mode 写成 0（仅当它还不存在）
            · 开关 rea_m1_off = YES 可一键静音（仍保留崩溃落盘）

                      ⚠ 装法：整份替换，不要和 v12 的 dylib 叠加 ⚠

          注入路径（与 v12 完全相同）
            @executable_path/Frameworks/BluedHushREA.dylib
            重签时必须与主 App 同证书 / 同描述文件，否则 dyld 直接拒绝加载

          日志
            实时：Console.app / syslog 过滤 "REA-Test"，每行以 [REA-Test] 开头
            落盘：App 沙盒 Documents/REA-M1.log（每次启动追加，首行带 t=0.000）
            崩溃：App 沙盒 Documents/REA-M1-crash.log（信号/异常 + 最近 160 行环形缓冲）

          局域网直推（v2：地址已硬编码，不做自动发现）
            目标：192.168.1.10:8765   ← 编进二进制；换 IP 必须改 M1Trace.xm 的 M1_DEFAULT_UPLOAD 重编
            电脑端：python tools\m1log_server.py
            启动后看这两行判定连通性：
              [M1] UPLOAD on(hardcoded) target=192.168.1.10:8765
              [M1] UPLOAD probe 192.168.1.10:8765 OK（TCP 已连通，日志开始推）
            probe FAIL 的 errno 含义：
              61 = 电脑端脚本没跑 / 端口不对
              60·65 = 不同网段 / 防火墙丢包 / iOS 本地网络权限被拦
              1 = 本地网络权限被本 App 拒绝
            defaults 里的 rea_m1_upload 若存在，会覆盖硬编码值（临时换地址不用重编）
          EOF

          echo "--- dist ---";    ls -lR dist    || true
          echo "--- dist-m1 ---"; ls -lR dist-m1 || true
          test -s dist/BluedHushREA.dylib   && echo "release OK: $(wc -c < dist/BluedHushREA.dylib) bytes"
          test -s dist-m1/BluedHushREA.dylib && echo "m1 OK: $(wc -c < dist-m1/BluedHushREA.dylib) bytes"

      - name: Upload release artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BluedHushREA-dylib
          path: dist/**
          if-no-files-found: error
          retention-days: 14

      - name: Upload m1 artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BluedHushREA-dylib-m1
          path: dist-m1/**
          if-no-files-found: warn
          retention-days: 14

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            build-release.log
            build-m1.log
            deps-release.txt
            deps-m1.txt
          if-no-files-found: ignore
