name: build

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    env:
      THEOS: /Users/runner/theos
      THEOS_MAKE_PATH: /Users/runner/theos/makefiles

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          brew install ldid xz make 2>/dev/null || brew install ldid xz
          clang --version | head -3

      - name: Fetch Theos + iPhoneOS SDKs
        run: |
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$THEOS"
          mkdir -p "$THEOS/sdks"
          curl -fsSL https://github.com/theos/sdks/archive/master.tar.gz -o /tmp/sdks.tar.gz
          tar xzf /tmp/sdks.tar.gz -C /tmp
          for d in /tmp/sdks-master/iPhoneOS*.sdk; do
            cp -R "$d" "$THEOS/sdks/" 2>/dev/null || true
          done
          ls "$THEOS/sdks"

      - name: Build tweak
        run: |
          set -o pipefail
          make clean || true
          make FINALPACKAGE=1 2>&1 | tee build.log
          echo "--- raw outputs ---"
          find .theos/obj -name '*.dylib' 2>/dev/null | sort
          ls packages 2>/dev/null || true

      # ================= 硬门禁 =================
      - name: Gate - arch + no substrate + no rootful path
        run: |
          DYLIB=$(find .theos/obj -name 'BluedHushREA.dylib' | head -1)
          echo "dylib=$DYLIB"
          lipo -info "$DYLIB"
          echo "== otool -L =="
          otool -L "$DYLIB" | tee deps.txt
          echo "== install_name =="
          otool -D "$DYLIB" || true
          echo "== LC_RPATH =="
          otool -l "$DYLIB" | grep -A2 LC_RPATH || echo "(none)"

          if grep -qi 'CydiaSubstrate' deps.txt; then
            echo "::error::still links CydiaSubstrate -> non-jailbroken / LiveContainer load will fail"
            exit 1
          fi
          if grep -qE '^[[:space:]]*/Library/(MobileSubstrate|Frameworks)/' deps.txt; then
            echo "::error::rootful absolute dependency path -> cannot resolve outside jailbreak"
            exit 1
          fi
          echo "OK: dependency list is jailbreak-free"

      - name: Gate - no Logos / substrate symbols
        run: |
          DYLIB=$(find .theos/obj -name 'BluedHushREA.dylib' | head -1)
          echo "== undefined MSHook* =="
          if nm -u "$DYLIB" | grep -i 'MSHook'; then
            echo "::error::binary still references MSHook*"; exit 1
          else
            echo "OK: no MSHook* symbol"
          fi
          echo "== Logos symbols =="
          if nm "$DYLIB" | grep -i 'logos'; then
            echo "::error::Logos runtime symbols present"; exit 1
          else
            echo "OK: no Logos symbols"
          fi
          echo "== must-have strings (ASCII) =="
          strings -a "$DYLIB" | grep -E 'REA-Test|msgId shim|hooks installed ok|premain|ctor-first' | sort -u
          if strings -a "$DYLIB" | grep -q 'REA-Test'; then echo "OK: REA-Test tag present"; else echo "::error::REA-Test tag missing"; exit 1; fi
          echo "OK: gates passed"

      # ================= 打包（关键：确保 zip 不为空） =================
      - name: Stage dist (dylib + plist + notes)
        if: always()
        run: |
          rm -rf dist && mkdir -p dist
          FAT=$(find .theos/obj -maxdepth 3 -name 'BluedHushREA.dylib' | head -1)
          echo "FAT=$FAT"
          if [ -n "$FAT" ]; then cp "$FAT" dist/BluedHushREA.dylib; fi
          for arch in arm64 arm64e; do
            f=".theos/obj/$arch/BluedHushREA.dylib"
            if [ -f "$f" ]; then mkdir -p "dist/$arch"; cp "$f" "dist/$arch/"; fi
          done
          cp BluedHushREA.plist dist/ || true
          for d in packages/*.deb; do [ -f "$d" ] && cp "$d" dist/; done
          cat > dist/INSTALL.txt <<'EOF'
          BluedHushREA v10  (pure ObjC Runtime hooks, no CydiaSubstrate, no Logos)

          文件说明
            BluedHushREA.dylib        FAT 双切片（arm64 + arm64e），非越狱/自签/LiveContainer 用这个
            arm64/BluedHushREA.dylib  仅 arm64（老设备 A11 及以前）
            arm64e/BluedHushREA.dylib 仅 arm64e（A12 及以后，绝大多数机器）
            BluedHushREA.plist        substrate 过滤器（仅越狱环境需要，非越狱可忽略）

          v10 界面（按原版 19 张截图还原：9 大模块 / 27 个分区 / 105 个开关）
            窗口立刻挂球：REAUIStart 每 0.5s 重试、最多 40 次，宿主一建好窗口就出现蓝色悬浮球（闪电圆环）
            · 单击  → present 设置面板（模块列表，每行显示「已开 x/y · 说明」）
            · 进入模块 → 分区列表，每个开关是真实 UISwitch，分区页脚「已开 x/y · 该分区作用」
            · 拖动  → 移动位置，松手自动贴边，位置记在 NSUserDefaults 的 rea_ball_center
            · 长按  → 快捷菜单（打开完整面板 / Hook 报告 / 触发统计 / 隐藏悬浮球）
            · 面板右上「全部关闭」一键清空所有开关
            模块划分：净化中心 / 聊天增强 / 隐私与特权 / 定位与追踪 / 自动化与筛选 /
                      视奸与访问 / 照片与相册 / 入口与手势 / 风控与设备
            面板里每个开关写的都是 Hook 读取的同一个 key（switch_xxx / purify_xxx），
            改完立即生效、无需重启；杀进程重启后开关与球的位置都保留（NSUserDefaults）。
            原版图标全部是 SF Symbols（dylib 内 .bundle/.xib/.nib/Assets.car/imageNamed 均为 0 次），
            因此本工程不携带任何资源包，产物只有 dylib + plist。

          v10 Hook 模块（Tweak.xm）与 UI 模块（REAUI.xm）完全解耦
            Tweak.xm  : 36 条显式 Hook + 12 个反越狱选择子全类扫描，每条 Hook 第一行先读开关，
                        开关为 OFF 时直接调用原实现 / 返回原值（不产生任何副作用）。
            REAUI.xm  : 只有 UIKit 与 NSUserDefaults 读写，零 swizzling，通过 5 个桥函数与 Hook 层通信。
            日志：App 沙盒 Documents/BluedHushREA.log（含 [UI] 前缀的界面事件与 pass/ok/miss 统计）。

          非越狱 + Esign / Sideloadly 注入
            1. 用 Esign 打开已重签的 Blued IPA -> 「注入/插入动态库」选择 BluedHushREA.dylib
            2. 注入路径填 @executable_path/Frameworks/BluedHushREA.dylib
            3. 重新签名（证书 + 描述文件必须与主 App 一致）后安装
            4. 日志：Console.app 过滤 "REA-Test"，或 LiveContainer 内查看 stdout
               第一行应为：[REA-Test] Runtime 注入成功!
               日志文件：App 沙盒 Documents/BluedHushREA.log

          LiveContainer 特别说明
            LiveContainer 里 App 运行在宿主进程内，dyld 注入方式仍然有效；
            但 substrate 过滤器不生效（没有 substrate 运行时），所以 plist 只对越狱环境有意义。
            若在 LiveContainer 里仍然完全没有日志 => dylib 没被 dyld 加载，检查注入路径与签名。
          EOF
          echo "--- dist tree ---"
          ls -lR dist
          test -s dist/BluedHushREA.dylib && echo "dist OK: $(wc -c < dist/BluedHushREA.dylib) bytes"

      - name: Upload dylib artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BluedHushREA-dylib
          path: dist/**
          if-no-files-found: error
          retention-days: 14

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            build.log
            deps.txt
          if-no-files-found: ignore
